<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Uploaded images for the Allen High School Mock Trial and Youth & Government club.">
  <title>Uploaded Images — Y&amp;G Booster Club</title>
  <style>
    :root { color-scheme: light; --navy:#0A1F44; --red:#8f1c25; --gray:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; color:#172033; background:#f7f8fa; font-family:Inter,Arial,sans-serif; }
    header { padding:24px; color:white; background:var(--navy); }
    header a { color:white; }
    main { width:min(1100px, calc(100% - 32px)); margin:48px auto; }
    h1 { margin:8px 0 12px; color:var(--navy); }
    p { color:var(--gray); line-height:1.6; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-top:28px; }
    figure { margin:0; padding:12px; background:white; border:1px solid #e4e7ec; border-radius:12px; box-shadow:0 4px 16px #0a1f4410; }
    figure a { display:block; }
    img { display:block; width:100%; height:260px; object-fit:contain; background:#f1f3f5; border-radius:7px; }
    figcaption { padding:12px 2px 2px; color:#344054; font-size:.9rem; overflow-wrap:anywhere; }
    footer { padding:24px; text-align:center; color:var(--gray); }
  </style>
</head>
<body>
  <header><a href="index.html">← Y&amp;G Booster Club home</a></header>
  <main>
    <h1>Uploaded Mock Trial images</h1>

    <div class="grid">

      <figure><a href="images/ChatGPT%20Image%20Nov%202,%202026,%2003_06_17%20PM.png"><img loading="lazy" src="images/ChatGPT%20Image%20Nov%202,%202026,%2003_06_17%20PM.png" alt="Uploaded Mock Trial image 2"></a><figcaption>Uploaded image 2</figcaption></figure>
      <figure><a href="images/ChatGPT%20Image%20Nov%202,%202026,%2003_06_25%20PM.png"><img loading="lazy" src="images/ChatGPT%20Image%20Nov%202,%202026,%2003_06_25%20PM.png" alt="Uploaded Mock Trial image 3"></a><figcaption>Uploaded image 3</figcaption></figure>
      <figure><a href="images/ChatGPT%20Image%20Nov%202,%202026,%2003_06_38%20PM.png"><img loading="lazy" src="images/ChatGPT%20Image%20Nov%202,%202026,%2003_06_38%20PM.png" alt="Uploaded Mock Trial image 4"></a><figcaption>Uploaded image 4</figcaption></figure>
