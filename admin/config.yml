backend:
  name: github
  repo: jollybob456-ux/Mock-Trial
  branch: main
  base_url: https://mock-trial-oauth.jollybob456.workers.dev
  auth_endpoint: auth

# Where the CMS is allowed to write files. Keeping this scoped to
# /data and /images/uploads means logged-in editors can only ever
# change the announcement banner, the events list, and the homepage
# flyer — nothing else on the site.
publish_mode: simple
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Homepage & Schedule"
    files:
      - file: "data/announcement.json"
        label: "Homepage Announcement Banner"
        name: "announcement"
        description: "Controls the red banner at the top of the homepage."
        fields:
          - { label: "Show banner on homepage?", name: "show", widget: "boolean", default: true }
          - { label: "Small label (e.g. 'Announcement')", name: "label", widget: "string", default: "Announcement" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Message", name: "message", widget: "text", required: false }
          - { label: "Button text (optional)", name: "linkText", widget: "string", required: false }
          - { label: "Button link (optional, e.g. /#join)", name: "linkHref", widget: "string", required: false }

      - file: "data/events.json"
        label: "Upcoming Events (Schedule Page)"
        name: "events"
        description: "The three soonest events (by date) automatically show on the Schedule page — no need to reorder or remove past ones manually, though deleting old entries keeps this list tidy."
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{title}} — {{fields.date}}"
            fields:
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Location / Time", name: "location", widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["pending", "confirmed"]
                default: "confirmed"

      - file: "data/calendar.json"
        label: "Full Year Calendar (PDF)"
        name: "calendar"
        description: "The downloadable full calendar PDF linked on the Schedule page."
        fields:
          - { label: "Calendar file (PDF)", name: "file", widget: "file", required: false }
          - { label: "Link label", name: "label", widget: "string", default: "Full Year Calendar" }

      - file: "data/flyer.json"
        label: "Homepage Flyer / Poster"
        name: "flyer"
        description: "Upload an image or PDF flyer to display in the dark box on the homepage. Leave 'Show' off to hide it and show the default illustration instead."
        fields:
          - { label: "Show flyer on homepage?", name: "show", widget: "boolean", default: false }
          - { label: "Flyer file (image or PDF)", name: "file", widget: "file", required: false }
          - { label: "Caption (optional, shown under the flyer)", name: "caption", widget: "string", required: false }
